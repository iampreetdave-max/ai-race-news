version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: python run.py --api --port 8000
    restart: unless-stopped

  scraper:
    build: .
    volumes:
      - ./data:/app/data
    command: python run.py --schedule --interval 15
    restart: unless-stopped
    depends_on:
      - api
