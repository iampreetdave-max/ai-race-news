
  name: Scrape AI News

  on:
    schedule:
      - cron: '0 8 * * *'
    workflow_dispatch:

  jobs:
    scrape:
      runs-on: ubuntu-latest
      permissions:
        contents: write

      steps:
        - uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install dependencies
          run: pip install feedparser beautifulsoup4 requests lxml python-dateutil

        - name: Restore DB cache
          uses: actions/cache@v4
          with:
            path: data/ai_pulse.db
            key: scraper-db

        - name: Create directories
          run: mkdir -p data frontend/public/data

        - name: Run scraper
          run: python run.py

        - name: Delete articles older than 30 days
          run: python run.py --cleanup 30

        - name: Export to JSON
          run: python scraper/export_json.py

        - name: Commit and push JSON
          run: |
            git config user.name "AI Race Bot"
            git config user.email "bot@airace.news"
            git add frontend/public/data/*.json
            git diff --staged --quiet || git commit -m "data: update news $(date -u +%Y-%m-%dT%H:%M)"
            git push
